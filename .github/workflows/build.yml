name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Pasang kebutuhan build
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer "cython<3" virtualenv setuptools

      - name: Build APK
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log

      - name: Ringkasan error
        if: failure()
        shell: bash
        run: |
          echo "===== BARIS ERROR ====="
          grep -n -i -E "error|failed|traceback|fatal" build.log | grep -v -E "print-multi-os-directory|no input files|checking" | tail -40 | cut -c1-300
          echo "===== 60 BARIS TERAKHIR ====="
          tail -60 build.log | cut -c1-300

      - name: Simpan log lengkap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: kasir-anak-pelangi-apk
          path: bin/*.apk
